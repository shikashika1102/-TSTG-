<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRAWL MINI - 3v3 Gem Grab</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0; padding: 0; background: #111; color: #fff;
    font-family: 'Arial Black', 'Hiragino Kaku Gothic ProN', sans-serif;
    overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh;
  }
  canvas {
    background: #d8a75e;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    max-width: 100%; max-height: 100%;
  }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-bar {
    display: flex; justify-content: center; align-items: center; gap: 20px;
    padding: 12px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  }
  .gem-box {
    display: flex; align-items: center; gap: 8px; padding: 6px 16px;
    border-radius: 20px; font-size: 20px; font-weight: bold;
    border: 3px solid #fff; text-shadow: 1px 1px 2px #000;
  }
  .blue-team { background: #1e88e5; }
  .red-team { background: #e53935; }
  #countdown-banner {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); border: 3px solid #ffeb3b; color: #ffeb3b;
    padding: 8px 24px; border-radius: 12px; font-size: 22px; display: none;
    animation: pulse 0.5s infinite alternate;
  }
  @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.08); } }
  
  /* スマホ用バーチャルパッド */
  #touch-controls {
    position: absolute; bottom: 20px; left: 0; width: 100%; height: 160px;
    display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none;
  }
  .stick-zone {
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
    position: relative; pointer-events: auto; touch-action: none;
  }
  .stick-knob {
    width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.7);
    position: absolute; top: 38px; left: 38px; pointer-events: none;
  }
  #ult-btn {
    width: 80px; height: 80px; border-radius: 50%; background: #444;
    border: 4px solid #888; color: #aaa; font-size: 16px; font-weight: bold;
    display: flex; justify-content: center; align-items: center;
    position: absolute; bottom: 110px; right: 160px; pointer-events: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s;
  }
  #ult-btn.ready {
    background: radial-gradient(circle, #ffeb3b, #ff9800);
    border-color: #fff; color: #000; transform: scale(1.1);
    box-shadow: 0 0 20px #ffeb3b; cursor: pointer;
  }

  /* スタート・リザルト画面 */
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
    justify-content: center; align-items: center; pointer-events: auto; z-index: 10;
  }
  #overlay h1 { font-size: 48px; color: #ffeb3b; text-shadow: 3px 3px 0 #d84315; margin-bottom: 10px; text-align: center; }
  #overlay p { font-size: 16px; color: #ddd; margin-bottom: 30px; text-align: center; line-height: 1.6; max-width: 500px; padding: 0 20px; }
  button.play-btn {
    padding: 15px 40px; font-size: 24px; font-weight: bold; color: #000;
    background: #ffeb3b; border: 4px solid #fff; border-radius: 15px;
    cursor: pointer; box-shadow: 0 6px 0 #f57f17; transition: 0.1s;
  }
  button.play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #f57f17; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
  <div class="top-bar">
    <div class="gem-box blue-team">💎 <span id="blue-gems">0</span></div>
    <div style="font-size: 14px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 10px;">10個集めて15秒キープ！</div>
    <div class="gem-box red-team">💎 <span id="red-gems">0</span></div>
  </div>
  <div id="countdown-banner">COUNTDOWN: <span id="cd-time">15.0</span>s</div>

  <div id="touch-controls">
    <div class="stick-zone" id="move-zone"><div class="stick-knob" id="move-knob"></div></div>
    <div id="ult-btn">ULT</div>
    <div class="stick-zone" id="aim-zone" style="border-color: rgba(255,100,100,0.6);"><div class="stick-knob" id="aim-knob" style="background: rgba(255,100,100,0.8);"></div></div>
  </div>
</div>

<div id="overlay">
  <h1 id="result-title">BRAWL MINI</h1>
  <p id="result-desc">
    <b>【PC操作】</b> WASDキーで移動 / マウスで狙って左クリックで射撃 / 右クリック(またはSpace)で必殺技<br>
    <b>【スマホ操作】</b> 左スティックで移動 / 右スティックで狙って離すと射撃 / ULTボタンで必殺技<br><br>
    🌿 <b>草むら</b>に入ると敵から見えなくなります！
  </p>
  <button class="play-btn" onclick="startGame()">バトル開始！</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// マップ設定
const MAP_W = 1400;
const MAP_H = 900;
canvas.width = 1000;
canvas.height = 650;

// ゲーム状態
let gameState = 'MENU';
let entities = [];
let bullets = [];
let gems = [];
let walls = [];
let bushes = [];
let particles = [];
let floatTexts = [];
let gemSpawnTimer = 0;
let countdown = 15.0;
let countdownTeam = null;
let lastTime = 0;

// 入力管理
const keys = {};
const mouse = { x: 0, y: 0, down: false, rightDown: false };
const touchMove = { active: false, dx: 0, dy: 0 };
const touchAim = { active: false, dx: 0, dy: 0 };

// 障害物と草むらの初期配置
function initMap() {
  walls = [
    // 中央周辺の遮蔽物
    { x: 520, y: 350, w: 40, h: 200, destructible: true },
    { x: 840, y: 350, w: 40, h: 200, destructible: true },
    { x: 620, y: 250, w: 160, h: 40, destructible: true },
    { x: 620, y: 610, w: 160, h: 40, destructible: true },
    // サイドの壁
    { x: 250, y: 200, w: 80, h: 80, destructible: true },
    { x: 250, y: 620, w: 80, h: 80, destructible: true },
    { x: 1070, y: 200, w: 80, h: 80, destructible: true },
    { x: 1070, y: 620, w: 80, h: 80, destructible: true },
  ];

  bushes = [
    // サイドのブッシュ（ステルス用）
    { x: 350, y: 100, w: 220, h: 120 },
    { x: 830, y: 100, w: 220, h: 120 },
    { x: 350, y: 680, w: 220, h: 120 },
    { x: 830, y: 680, w: 220, h: 120 },
    // 中央付近のブッシュ
    { x: 420, y: 380, w: 80, h: 140 },
    { x: 900, y: 380, w: 80, h: 140 },
  ];
}

// キャラクタークラス
class Fighter {
  constructor(id, team, isPlayer, x, y, role) {
    this.id = id;
    this.team = team; // 'blue' or 'red'
    this.isPlayer = isPlayer;
    this.spawnX = x;
    this.spawnY = y;
    this.x = x;
    this.y = y;
    this.radius = 22;
    this.role = role; // 'shooter', 'tank', 'sniper'

    // 役職ごとのステータス設定
    if (role === 'tank') {
      this.maxHp = 5500; this.speed = 210; this.dmg = 450; this.range = 240; this.spread = 0.35; this.pellets = 4; this.color = team === 'blue' ? '#0288d1' : '#c62828';
    } else if (role === 'sniper') {
      this.maxHp = 3200; this.speed = 195; this.dmg = 1300; this.range = 520; this.spread = 0; this.pellets = 1; this.color = team === 'blue' ? '#29b6f6' : '#ef5350';
    } else {
      this.maxHp = 4000; this.speed = 205; this.dmg = 750; this.range = 380; this.spread = 0.08; this.pellets = 2; this.color = team === 'blue' ? '#1e88e5' : '#e53935';
    }

    this.hp = this.maxHp;
    this.ammo = 3;
    this.maxAmmo = 3;
    this.reloadTimer = 0;
    this.reloadTime = 1.3;
    this.ultCharge = 0; // 100で満タン
    this.gems = 0;
    this.dead = false;
    this.respawnTimer = 0;
    this.combatTimer = 0; // 非戦闘時間計測（自動回復用）
    this.inBush = false;
    this.revealedTimer = 0;
    this.aimAngle = team === 'blue' ? 0 : Math.PI;
    this.aiTimer = 0;
    this.aiTargetX = x;
    this.aiTargetY = y;
  }

  update(dt) {
    if (this.dead) {
      this.respawnTimer -= dt;
      if (this.respawnTimer <= 0) {
        this.dead = false;
        this.hp = this.maxHp;
        this.ammo = 3;
        this.x = this.spawnX;
        this.y = this.spawnY;
        spawnParticles(this.x, this.y, '#fff', 15);
      }
      return;
    }

    // リロード処理
    if (this.ammo < this.maxAmmo) {
      this.reloadTimer += dt;
      if (this.reloadTimer >= this.reloadTime) {
        this.ammo++;
        this.reloadTimer = 0;
      }
    }

    // 非戦闘時の自動回復
    this.combatTimer += dt;
    if (this.combatTimer > 3.0 && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.15 * dt);
    }

    // ブッシュ判定
    this.inBush = bushes.some(b => this.x > b.x && this.x < b.x + b.w && this.y > b.y && this.y < b.y + b.h);
    if (this.revealedTimer > 0) this.revealedTimer -= dt;

    let vx = 0, vy = 0;

    if (this.isPlayer) {
      // キーボード移動
      if (keys['KeyW'] || keys['ArrowUp']) vy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) vy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) vx += 1;

      // タッチ移動
      if (touchMove.active) {
        vx = touchMove.dx;
        vy = touchMove.dy;
      }

      if (vx !== 0 || vy !== 0) {
        const len = Math.hypot(vx, vy);
        vx /= len; vy /= len;
      }

      // エイム角度
      if (touchAim.active) {
        this.aimAngle = Math.atan2(touchAim.dy, touchAim.dx);
      } else {
        const camX = this.x - canvas.width / 2;
        const camY = this.y - canvas.height / 2;
        this.aimAngle = Math.atan2((mouse.y + camY) - this.y, (mouse.x + camX) - this.x);
      }

      // 射撃トリガー
      if (mouse.down) {
        this.shoot(false);
        mouse.down = false;
      }
      if (mouse.rightDown || keys['Space']) {
        this.shoot(true);
        mouse.rightDown = false;
        keys['Space'] = false;
      }
    } else {
      // AIの思考ルーチン
      this.runAI(dt);
      vx = Math.cos(this.aiMoveAngle || 0) * (this.aiShouldMove ? 1 : 0);
      vy = Math.sin(this.aiMoveAngle || 0) * (this.aiShouldMove ? 1 : 0);
    }

    // 移動と壁衝突判定
this.moveWithCollision(vx * this.speed * dt, vy * this.speed * dt);
// エメラルド取得
for (let i = gems.length - 1; i >= 0; i--) {
if (Math.hypot(this.x - gems[i].x, this.y - gems[i].y) < this.radius + 14) {
this.gems++;
gems.splice(i, 1);
addFloatText(this.x, this.y - 30, '+1 💎', '#e040fb');
}
}
}
runAI(dt) {
this.aiTimer -= dt;
// 一番近い視認可能な敵を探す
let nearestEnemy = null;
let minEnemyDist = 9999;
entities.forEach(e => {
if (e.team !== this.team && !e.dead && e.isVisibleTo(this.team)) {
const d = Math.hypot(e.x - this.x, e.y - this.y);
if (d < minEnemyDist) { minEnemyDist = d; nearestEnemy = e; }
}
});

// 一番近いエメラルドを探す
let nearestGem = null;
let minGemDist = 9999;
gems.forEach(g => {
const d = Math.hypot(g.x - this.x, g.y - this.y);
if (d < minGemDist) { minGemDist = d; nearestGem = g; }
});
if (this.aiTimer <= 0) {
this.aiTimer = 0.4 + Math.random() * 0.4;
// 行動優先度：エメラルドを多く持っているなら自陣へ退避
if (this.gems >= 5 || this.hp < this.maxHp * 0.35) {
this.aiTargetX = this.spawnX + (Math.random() - 0.5) * 150;
this.aiTargetY = this.spawnY + (Math.random() - 0.5) * 200;
} else if (nearestGem && minGemDist < 450) {
this.aiTargetX = nearestGem.x;
this.aiTargetY = nearestGem.y;
} else if (nearestEnemy) {
// 適正距離を保つ
const idealDist = this.range * 0.7;
const ang = Math.atan2(this.y - nearestEnemy.y, this.x - nearestEnemy.x);
this.aiTargetX = nearestEnemy.x + Math.cos(ang) * idealDist + (Math.random() - 0.5) * 120;
this.aiTargetY = nearestEnemy.y + Math.sin(ang) * idealDist + (Math.random() - 0.5) * 120;
} else {
// 中央へ移動
this.aiTargetX = MAP_W / 2 + (Math.random() - 0.5) * 200;
this.aiTargetY = MAP_H / 2 + (Math.random() - 0.5) * 200;
}
}
const distToTarget = Math.hypot(this.aiTargetX - this.x, this.aiTargetY - this.y);
this.aiShouldMove = distToTarget > 20;
this.aiMoveAngle = Math.atan2(this.aiTargetY - this.y, this.aiTargetX - this.x);
// 攻撃判断
if (nearestEnemy && minEnemyDist <= this.range * 1.1) {
this.aimAngle = Math.atan2(nearestEnemy.y - this.y, nearestEnemy.x - this.x) + (Math.random() - 0.5) * 0.15;
if (this.ultCharge >= 100) {
this.shoot(true);
} else if (this.ammo >= 1 && Math.random() < 0.15) {
this.shoot(false);
}
}
}
moveWithCollision(dx, dy) {
this.x = Math.max(this.radius, Math.min(MAP_W - this.radius, this.x + dx));
for (let w of walls) {
if (circleRectCollide(this.x, this.y, this.radius, w.x, w.y, w.w, w.h)) {
this.x -= dx; break;
}
}
this.y = Math.max(this.radius, Math.min(MAP_H - this.radius, this.y + dy));
for (let w of walls) {
if (circleRectCollide(this.x, this.y, this.radius, w.x, w.y, w.w, w.h)) {
this.y -= dy; break;
}
}
}
shoot(isUlt) {
if (this.dead) return;
if (isUlt) {
if (this.ultCharge < 100) return;
this.ultCharge = 0;
this.combatTimer = 0;
this.revealedTimer = 1.5;
// 必殺技：壁を破壊する巨大な貫通弾を発射
bullets.push({
owner: this, team: this.team, x: this.x, y: this.y,
vx: Math.cos(this.aimAngle) * 650, vy: Math.sin(this.aimAngle) * 650,
dmg: this.dmg * 2.2, range: 600, traveled: 0, radius: 24, isUlt: true
});
addFloatText(this.x, this.y - 35, 'SUPER!!', '#ffeb3b');
updateUltButton();
return;
}
if (this.ammo < 1) return;
this.ammo--;
this.combatTimer = 0;
this.revealedTimer = 1.5;
for (let i = 0; i < this.pellets; i++) {
const offset = (i - (this.pellets - 1) / 2) * this.spread;
const ang = this.aimAngle + offset;
bullets.push({
owner: this, team: this.team, x: this.x, y: this.y,
vx: Math.cos(ang) * 580, vy: Math.sin(ang) * 580,
dmg: this.dmg, range: this.range, traveled: 0, radius: 8, isUlt: false
});
}
}
takeDamage(amount, attacker) {
if (this.dead) return;
this.hp -= amount;
this.combatTimer = 0;
this.revealedTimer = 1.5;
addFloatText(this.x, this.y - 25, -${Math.round(amount)}, '#ff5252');
spawnParticles(this.x, this.y, this.color, 6);
if (attacker) {
attacker.ultCharge = Math.min(100, attacker.ultCharge + (amount / 1200) * 35);
if (attacker.isPlayer) updateUltButton();
}
if (this.hp <= 0) {
this.hp = 0;
this.dead = true;
this.respawnTimer = 4.0;
spawnParticles(this.x, this.y, '#fff', 25);
// 持っていたエメラルドを周囲にばらまく
for (let i = 0; i < this.gems; i++) {
const ang = Math.random() * Math.PI * 2;
const dist = 20 + Math.random() * 40;
gems.push({
x: Math.max(40, Math.min(MAP_W - 40, this.x + Math.cos(ang) * dist)),
y: Math.max(40, Math.min(MAP_H - 40, this.y + Math.sin(ang) * dist))
});
}
this.gems = 0;
}
}
isVisibleTo(viewerTeam) {
if (this.team === viewerTeam) return true;
if (!this.inBush || this.revealedTimer > 0) return true;
// ブッシュ内にいても敵が至近距離にいれば見える
return entities.some(e => e.team === viewerTeam && !e.dead && Math.hypot(e.x - this.x, e.y - this.y) < 110);
}
}
// ユーティリティ
function circleRectCollide(cx, cy, cr, rx, ry, rw, rh) {
const testX = Math.max(rx, Math.min(cx, rx + rw));
const testY = Math.max(ry, Math.min(cy, ry + rh));
return Math.hypot(cx - testX, cy - testY) <= cr;
}
function spawnParticles(x, y, color, count) {
for (let i = 0; i < count; i++) {
const ang = Math.random() * Math.PI * 2;
const spd = 50 + Math.random() * 150;
particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 0.4, color });
}
}
function addFloatText(x, y, text, color) {
floatTexts.push({ x, y, text, color, life: 0.8 });
}
function updateUltButton() {
const player = entities.find(e => e.isPlayer);
const btn = document.getElementById('ult-btn');
if (player && player.ultCharge >= 100) {
btn.classList.add('ready');
btn.innerText = 'ULT!';
} else {
btn.classList.remove('ready');
btn.innerText = player ? ${Math.floor(player.ultCharge)}% : 'ULT';
}
}
// ゲーム開始処理
function startGame() {
document.getElementById('overlay').style.display = 'none';
initMap();
bullets = [];
gems = [];
particles = [];
floatTexts = [];
countdown = 15.0;
countdownTeam = null;
// 3vs3 チーム生成
entities = [
new Fighter(1, 'blue', true, 120, MAP_H / 2, 'shooter'), // プレイヤー
new Fighter(2, 'blue', false, 120, MAP_H / 2 - 140, 'tank'),
new Fighter(3, 'blue', false, 120, MAP_H / 2 + 140, 'sniper'),
new Fighter(4, 'red', false, MAP_W - 120, MAP_H / 2, 'shooter'),
new Fighter(5, 'red', false, MAP_W - 120, MAP_H / 2 - 140, 'tank'),
new Fighter(6, 'red', false, MAP_W - 120, MAP_H / 2 + 140, 'sniper'),
];
// 初期エメラルド配置
gems.push({ x: MAP_W / 2, y: MAP_H / 2 });
updateUltButton();
gameState = 'PLAYING';
lastTime = performance.now();
requestAnimationFrame(gameLoop);
}

// メインループ
function gameLoop(now) {
if (gameState !== 'PLAYING') return;
const dt = Math.min(0.05, (now - lastTime) / 1000);
lastTime = now;
update(dt);
draw();
requestAnimationFrame(gameLoop);
}
function update(dt) {
// 中央鉱山からエメラルド湧き
gemSpawnTimer += dt;
if (gemSpawnTimer >= 5.0 && gems.length < 12) {
gemSpawnTimer = 0;
gems.push({
x: MAP_W / 2 + (Math.random() - 0.5) * 60,
y: MAP_H / 2 + (Math.random() - 0.5) * 60
});
}
entities.forEach(e => e.update(dt));
// 弾の更新
for (let i = bullets.length - 1; i >= 0; i--) {
const b = bullets[i];
const stepX = b.vx * dt;
const stepY = b.vy * dt;
b.x += stepX;
b.y += stepY;
b.traveled += Math.hypot(stepX, stepY);
let hit = false;
// 壁判定
for (let wIdx = walls.length - 1; wIdx >= 0; wIdx--) {
const w = walls[wIdx];
if (circleRectCollide(b.x, b.y, b.radius, w.x, w.y, w.w, w.h)) {
if (b.isUlt && w.destructible) {
spawnParticles(w.x + w.w / 2, w.y + w.h / 2, '#a1887f', 15);
walls.splice(wIdx, 1); // ウルトは壁を破壊して貫通
} else {
hit = true;
spawnParticles(b.x, b.y, '#ffeb3b', 5);
break;
}
}
}
// 敵への命中判定
if (!hit) {
for (let e of entities) {
if (e.team !== b.team && !e.dead && Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
e.takeDamage(b.dmg, b.owner);
if (!b.isUlt) { hit = true; break; }
}
}
}
if (hit || b.traveled >= b.range || b.x < 0 || b.x > MAP_W || b.y < 0 || b.y > MAP_H) {
bullets.splice(i, 1);
}
}
// エフェクト更新
particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
particles = particles.filter(p => p.life > 0);
floatTexts.forEach(t => { t.y -= 30 * dt; t.life -= dt; });
floatTexts = floatTexts.filter(t => t.life > 0);
// チームエメラルド合計と勝利判定
const blueGems = entities.filter(e => e.team === 'blue').reduce((sum, e) => sum + e.gems, 0);
const redGems = entities.filter(e => e.team === 'red').reduce((sum, e) => sum + e.gems, 0);
document.getElementById('blue-gems').innerText = blueGems;
document.getElementById('red-gems').innerText = redGems;
const banner = document.getElementById('countdown-banner');
if (blueGems >= 10 && blueGems > redGems) {
if (countdownTeam !== 'blue') { countdownTeam = 'blue'; countdown = 15.0; }
countdown -= dt;
banner.style.display = 'block';
banner.style.borderColor = '#29b6f6';
banner.style.color = '#29b6f6';
document.getElementById('cd-time').innerText = Math.max(0, countdown).toFixed(1);
if (countdown <= 0) endGame('VICTORY!', '青チームの勝利！見事エメラルドを守り抜きました！');
} else if (redGems >= 10 && redGems > blueGems) {
if (countdownTeam !== 'red') { countdownTeam = 'red'; countdown = 15.0; }
countdown -= dt;
banner.style.display = 'block';
banner.style.borderColor = '#ef5350';
banner.style.color = '#ef5350';
document.getElementById('cd-time').innerText = Math.max(0, countdown).toFixed(1);
if (countdown <= 0) endGame('DEFEAT...', '赤チームの勝利！エメラルドを奪い返せませんでした。');
} else {
countdownTeam = null;
banner.style.display = 'none';
}
}
function endGame(title, desc) {
gameState = 'OVER';
document.getElementById('result-title').innerText = title;
document.getElementById('result-title').style.color = title === 'VICTORY!' ? '#4fc3f7' : '#ff5252';
document.getElementById('result-desc').innerText = desc;
document.querySelector('.play-btn').innerText = 'もう一度遊ぶ';
document.getElementById('overlay').style.display = 'flex';
}
// 描画処理
function draw() {
const player = entities.find(e => e.isPlayer);
// カメラをプレイヤー中心に追従（マップ端でクランプ）
const camX = Math.max(0, Math.min(MAP_W - canvas.width, player.x - canvas.width / 2));
const camY = Math.max(0, Math.min(MAP_H - canvas.height, player.y - canvas.height / 2));
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.save();
ctx.translate(-camX, -camY);
// 床のグリッド模様
ctx.strokeStyle = 'rgba(0,0,0,0.06)';
ctx.lineWidth = 2;
for (let x = 0; x <= MAP_W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke(); }
for (let y = 0; y <= MAP_H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke(); }
// 外枠
ctx.strokeStyle = '#5d4037';
ctx.lineWidth = 12;
ctx.strokeRect(0, 0, MAP_W, MAP_H);
// 中央エメラルド鉱山
ctx.fillStyle = '#37474f';
ctx.beginPath(); ctx.arc(MAP_W / 2, MAP_H / 2, 32, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = '#e040fb';
ctx.beginPath(); ctx.arc(MAP_W / 2, MAP_H / 2, 16, 0, Math.PI * 2); ctx.fill();
// 草むら（ブッシュ）
bushes.forEach(b => {
ctx.fillStyle = '#388e3c';
ctx.fillRect(b.x, b.y, b.w, b.h);
ctx.strokeStyle = '#1b5e20';
ctx.lineWidth = 3;
ctx.strokeRect(b.x, b.y, b.w, b.h);
});
// 壁（障害物）
walls.forEach(w => {
ctx.fillStyle = '#795548';
ctx.fillRect(w.x, w.y, w.w, w.h);
ctx.fillStyle = '#a1887f';
ctx.fillRect(w.x + 4, w.y + 4, w.w - 8, w.h - 12);
});
// エメラルド描画
gems.forEach(g => {
ctx.fillStyle = '#e040fb';
ctx.strokeStyle = '#fff';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(g.x, g.y - 12); ctx.lineTo(g.x + 10, g.y);
ctx.lineTo(g.x, g.y + 12); ctx.lineTo(g.x - 10, g.y);
ctx.closePath(); ctx.fill(); ctx.stroke();
});
// キャラクター描画
entities.forEach(e => {
if (e.dead) return;
if (!e.isVisibleTo('blue')) return; // 敵が草むらに隠れている場合は描画しない
ctx.save();
if (e.inBush) ctx.globalAlpha = 0.45; // 草むら内は半透明表示
// プレイヤーのエイム予測線
if (e.isPlayer) {
ctx.strokeStyle = e.ultCharge >= 100 && touchAim.active ? 'rgba(255,235,59,0.5)' : 'rgba(255,255,255,0.25)';
ctx.lineWidth = 14;
ctx.beginPath();
ctx.moveTo(e.x, e.y);
ctx.lineTo(e.x + Math.cos(e.aimAngle) * e.range, e.y + Math.sin(e.aimAngle) * e.range);
ctx.stroke();
}
// 足元のチームリング（ウルト満タン時は黄色く光る）
ctx.strokeStyle = e.ultCharge >= 100 ? '#ffeb3b' : (e.team === 'blue' ? '#4fc3f7' : '#ff8a80');
ctx.lineWidth = e.ultCharge >= 100 ? 5 : 3;
ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2); ctx.stroke();
// 本体
ctx.fillStyle = e.color;
ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
// 銃口（向き）
ctx.fillStyle = '#222';
ctx.beginPath();
ctx.arc(e.x + Math.cos(e.aimAngle) * 18, e.y + Math.sin(e.aimAngle) * 18, 7, 0, Math.PI * 2);
ctx.fill();
// HPバー
const barW = 48, barH = 7;
ctx.fillStyle = '#000';
ctx.fillRect(e.x - barW / 2, e.y - 38, barW, barH);
ctx.fillStyle = e.team === 'blue' ? '#00e676' : '#ff1744';
ctx.fillRect(e.x - barW / 2 + 1, e.y - 37, (barW - 2) * (e.hp / e.maxHp), barH - 2);
// プレイヤー専用：リロードバー（3分割）
if (e.isPlayer) {
for (let i = 0; i < 3; i++) {
const rx = e.x - barW / 2 + i * 16.5;
ctx.fillStyle = '#222';
ctx.fillRect(rx, e.y - 29, 15, 4);
if (i < e.ammo) {
ctx.fillStyle = '#ff9100';
ctx.fillRect(rx, e.y - 29, 15, 4);
} else if (i === e.ammo) {
ctx.fillStyle = '#ffe0b2';
ctx.fillRect(rx, e.y - 29, 15 * (e.reloadTimer / e.reloadTime), 4);
}
}
}
// 所持エメラルド数表示
if (e.gems > 0) {
ctx.fillStyle = '#e040fb';
ctx.font = 'bold 14px Arial';
ctx.textAlign = 'center';
ctx.fillText(💎${e.gems}, e.x, e.y - 44);
}
ctx.restore();
});
// 弾丸描画
bullets.forEach(b => {
ctx.fillStyle = b.isUlt ? '#ffeb3b' : (b.team === 'blue' ? '#80d8ff' : '#ff8a80');
ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
});
// パーティクル＆ダメージ数値
particles.forEach(p => {
ctx.fillStyle = p.color;
ctx.globalAlpha = p.life * 2;
ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
ctx.globalAlpha = 1;
});
floatTexts.forEach(t => {
ctx.fillStyle = t.color;
ctx.font = 'bold 16px Arial';
ctx.textAlign = 'center';
ctx.fillText(t.text, t.x, t.y);
});
ctx.restore();
}
// PC入力イベント
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
const rect = canvas.getBoundingClientRect();
mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});
canvas.addEventListener('mousedown', e => {
if (e.button === 0) mouse.down = true;
if (e.button === 2) mouse.rightDown = true;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
// スマホ用バーチャルスティック制御
function setupStick(zoneId, knobId, stateObj, onRelease) {
const zone = document.getElementById(zoneId);
const knob = document.getElementById(knobId);
const maxDist = 40;
zone.addEventListener('touchstart', e => {
e.preventDefault();
stateObj.active = true;
updateKnob(e.changedTouches[0]);
}, { passive: false });
zone.addEventListener('touchmove', e => {
e.preventDefault();
if (stateObj.active) updateKnob(e.changedTouches[0]);
}, { passive: false });
const endTouch = e => {
e.preventDefault();
if (stateObj.active && onRelease) onRelease();
stateObj.active = false;
stateObj.dx = 0; stateObj.dy = 0;
knob.style.transform = translate(0px, 0px);
};
zone.addEventListener('touchend', endTouch);
zone.addEventListener('touchcancel', endTouch);
function updateKnob(touch) {
const rect = zone.getBoundingClientRect();
const cx = rect.left + rect.width / 2;
const cy = rect.top + rect.height / 2;
let dx = touch.clientX - cx;
let dy = touch.clientY - cy;
const dist = Math.hypot(dx, dy);
if (dist > maxDist) {
dx = (dx / dist) * maxDist;
dy = (dy / dist) * maxDist;
}
knob.style.transform = translate(${dx}px, ${dy}px);
stateObj.dx = dx / maxDist;
stateObj.dy = dy / maxDist;
}
}
setupStick('move-zone', 'move-knob', touchMove, null);
setupStick('aim-zone', 'aim-knob', touchAim, () => {
const player = entities.find(e => e.isPlayer);
if (player) player.shoot(false);
});
