<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FANTASY ARENA - Prototype</title>
<style>
:root{--gold:#f5cf75;--panel:rgba(15,22,39,.88);--line:rgba(245,207,117,.55)}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10182a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#17243a}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 12px;box-shadow:0 5px 20px #0005;backdrop-filter:blur(5px)}
#heroBox{width:min(42vw,240px)}#enemyBox{width:min(42vw,240px);text-align:right}
.name{font-weight:800;color:var(--gold);font-size:13px}.hp{height:9px;background:#3b2631;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,#54d78b,#b7ec76);width:100%;transition:width .15s}
#timer{font-size:22px;font-weight:900;color:var(--gold);text-shadow:0 2px 6px #000}
#status{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:12px;color:#dbe6ff;background:#10182acc;border:1px solid #ffffff25;padding:6px 12px;border-radius:20px;white-space:nowrap}
#controls{position:fixed;inset:auto 0 12px 0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}
#stickArea{width:132px;height:132px;border-radius:50%;background:#ffffff16;border:2px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:54px;height:54px;border-radius:50%;background:linear-gradient(#e8f1ff,#9eb4d7);border:2px solid white;left:37px;top:37px;box-shadow:0 4px 12px #0008}
.buttons{display:grid;grid-template-columns:repeat(2,68px);gap:9px;pointer-events:auto}
button{position:relative;z-index:60;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font:700 12px system-ui;color:#fff;border:1px solid #ffffff70;background:linear-gradient(145deg,#3b527c,#202d49);border-radius:16px;min-height:58px;box-shadow:0 4px 0 #10182a,0 7px 15px #0006;touch-action:none}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #10182a}
button strong{display:block;font-size:20px}
#menu{position:fixed;inset:0;z-index:50;pointer-events:auto;touch-action:pan-y;background:linear-gradient(145deg,#0b1223ee,#172b46ee);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.card{position:relative;z-index:51;pointer-events:auto;width:min(560px,100%);background:#111d32f2;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 70px #0009;text-align:center}
h1{margin:0;color:var(--gold);font-size:clamp(28px,7vw,46px);letter-spacing:2px;text-shadow:0 4px 0 #654b27}
.sub{color:#c4d2e9;margin:5px 0 18px;font-size:13px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}
.choice{padding:12px 8px;min-height:78px}.choice.selected{outline:3px solid var(--gold);background:linear-gradient(145deg,#72582d,#293b5c)}
.choice span{display:block;font-size:25px;margin-bottom:3px}.choice small{color:#d4def0}
#start{width:100%;background:linear-gradient(145deg,#e4b85e,#9e6d2b);color:#201708;border:0;font-size:17px;min-height:52px}
.note{font-size:11px;color:#9eafc9;line-height:1.6;margin-top:12px}
#result{display:none;position:fixed;inset:0;background:#07101ddd;z-index:4;align-items:center;justify-content:center;padding:20px}
#result .card{max-width:380px}
@media(max-width:420px){#stickArea{width:116px;height:116px}#stick{left:31px;top:31px}.buttons{grid-template-columns:repeat(2,62px)}button{min-height:54px}.top{padding:8px}#status{top:67px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top">
  <div class="panel" id="heroBox"><div class="name" id="heroName">KNIGHT</div><div class="hp"><div class="fill" id="heroHp"></div></div></div>
  <div class="panel" style="text-align:center"><div id="timer">90</div><div style="font-size:10px;color:#b9c9e2">TIME</div></div>
  <div class="panel" id="enemyBox"><div class="name">ARENA GUARDIAN</div><div class="hp"><div class="fill" id="enemyHp"></div></div></div>
 </div>
 <div id="status">WASD / スティックで移動　・　CPU対戦</div>
</div>
<div id="controls">
 <div id="stickArea"><div id="stick"></div></div>
 <div class="buttons">
  <button id="attack"><strong>⚔</strong>攻撃</button>
  <button id="heavy"><strong>✦</strong>強攻撃</button>
  <button id="dodge"><strong>➤</strong>回避</button>
  <button id="guard"><strong>⬟</strong>ガード</button>
 </div>
</div>
<div id="menu">
 <div class="card">
  <h1>FANTASY ARENA</h1><div class="sub">幻想闘技場 — FIRST BATTLE</div>
  <div style="color:#f5cf75;font-weight:800">キャラクターを選択</div>
  <div class="choices">
   <button type="button" class="choice selected" data-class="knight" onclick="window.pickArenaClass('knight')"><span>🛡️</span>ナイト<small>バランス型・剣</small></button>
   <button type="button" class="choice" data-class="assassin" onclick="window.pickArenaClass('assassin')"><span>🗡️</span>アサシン<small>高速型・双剣</small></button>
   <button type="button" class="choice" data-class="wizard" onclick="window.pickArenaClass('wizard')"><span>🔮</span>ウィザード<small>遠距離型・魔法</small></button>
   <button type="button" class="choice" data-class="berserker" onclick="window.pickArenaClass('berserker')"><span>🪓</span>バーサーカー<small>パワー型・大斧</small></button>
  </div>
  <button type="button" id="start" onclick="window.beginArenaGame()">戦闘開始</button>
  <div class="note">試作版：このファイルだけで遊べるCPU対戦です。<br>オンライン対戦・ルーム機能は次の開発段階で追加します。</div>
 </div>
</div>
<div id="result"><div class="card"><h1 id="resultTitle">VICTORY</h1><p id="resultText">勝利！</p><button type="button" id="again" style="width:100%" onclick="window.returnArenaMenu()">もう一度遊ぶ</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,started=false,ended=false,chosen='knight',time=90,last=0;
const classes={
 knight:{name:'KNIGHT',color:'#79b9ee',hp:120,speed:2.7,damage:13,range:65,icon:'🛡'},
 assassin:{name:'ASSASSIN',color:'#c28af0',hp:90,speed:3.7,damage:9,range:58,icon:'🗡'},
 wizard:{name:'WIZARD',color:'#78e4df',hp:95,speed:2.8,damage:12,range:155,icon:'🔮'},
 berserker:{name:'BERSERKER',color:'#f19b72',hp:145,speed:2.25,damage:19,range:73,icon:'🪓'}
};
let player,enemy,particles=[],keys={},joy={x:0,y:0},guard=false,attackCooldown=0,heavyCooldown=0,dodgeTime=0,flash=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){
 const c=classes[chosen];player={x:W*.5,y:H*.70,z:0,hp:c.hp,max:c.hp,speed:c.speed,damage:c.damage,range:c.range,color:c.color,kind:chosen,face:-Math.PI/2,attack:0,guard:false,stun:0};
 enemy={x:W*.5,y:H*.29,z:0,hp:115,max:115,speed:2.05,damage:10,range:65,color:'#e87979',face:Math.PI/2,attack:0,guard:false,stun:0};
 particles=[];time=90;ended=false;started=true;attackCooldown=heavyCooldown=dodgeTime=flash=0;
 document.getElementById('heroName').textContent=c.name;document.getElementById('heroHp').style.width='100%';document.getElementById('enemyHp').style.width='100%';document.getElementById('timer').textContent='90';
 document.getElementById('menu').style.display='none';document.getElementById('result').style.display='none';
}
function chooseClass(name){
 chosen=name;
 document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.dataset.class===name));
}
function showMenu(){
 document.getElementById('menu').style.display='flex';
 document.getElementById('result').style.display='none';
 started=false;
}
window.pickArenaClass=chooseClass;
window.beginArenaGame=reset;
window.returnArenaMenu=showMenu;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='j')doAttack(false);if(e.key==='k')doAttack(true);if(e.key==='l')doDodge();if(e.key==='i')guard=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='i')guard=false});
function bindHold(id,down,up){
 const el=document.getElementById(id);
 let active=false;
 el.addEventListener('pointerdown',e=>{
   e.preventDefault();
   if(!active){active=true;down()}
   try{el.setPointerCapture(e.pointerId)}catch(_){}
 });
 const release=()=>{if(active){active=false;if(up)up()}};
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,release));
 el.addEventListener('click',e=>{
   if(!active){e.preventDefault();down();if(up)up()}
   active=false;
 });
}
bindHold('attack',()=>doAttack(false));bindHold('heavy',()=>doAttack(true));bindHold('dodge',doDodge);
bindHold('guard',()=>{guard=true},()=>{guard=false});
const area=document.getElementById('stickArea'),knob=document.getElementById('stick');let stickId=null;
function setJoy(e){const r=area.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=43;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
area.addEventListener('pointerdown',e=>{stickId=e.pointerId;area.setPointerCapture(stickId);setJoy(e)});area.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setJoy(e)});function endJoy(){stickId=null;joy={x:0,y:0};knob.style.transform='translate(0,0)'}area.addEventListener('pointerup',endJoy);area.addEventListener('pointercancel',endJoy);
function doAttack(heavy){if(!started||ended)return;if(heavy?heavyCooldown>0:attackCooldown>0)return;if(heavy)heavyCooldown=1.0;else attackCooldown=.38;player.attack=heavy?.35:.22;const c=classes[chosen];const dx=enemy.x-player.x,dy=enemy.y-player.y,d=Math.hypot(dx,dy);player.face=Math.atan2(dy,dx);if(chosen==='wizard'){if(d<player.range+35){hitEnemy(heavy?24:13)}}else if(d<player.range+(heavy?20:0)){hitEnemy(heavy?player.damage*1.8:player.damage)}}
function hitEnemy(dmg){if(enemy.guard)dmg*=.45;enemy.hp=Math.max(0,enemy.hp-dmg);enemy.stun=.16;burst(enemy.x,enemy.y-20,'#ffd77c',10);if(enemy.hp<=0)finish(true)}
function doDodge(){if(!started||ended||dodgeTime>0)return;dodgeTime=.28;player.x+=Math.cos(player.face)*35;player.y+=Math.sin(player.face)*35;player.x=clamp(player.x,80,W-80);player.y=clamp(player.y,H*.22,H*.83);burst(player.x,player.y,'#9bdcff',7)}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.3,color})}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function finish(win){ended=true;document.getElementById('resultTitle').textContent=win?'VICTORY':'DEFEAT';document.getElementById('resultText').textContent=win?'闘技場の勝者はあなた！':'今回は敗北…。戦術を変えて再挑戦しよう。';document.getElementById('result').style.display='flex'}
function move(p,dx,dy,spd){let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}p.x+=dx*spd;p.y+=dy*spd;p.x=clamp(p.x,65,W-65);p.y=clamp(p.y,H*.18,H*.84);if(l>.1)p.face=Math.atan2(dy,dx)}
function update(dt){
 if(!started||ended)return;time-=dt;if(time<=0){time=0;finish(player.hp>=enemy.hp)}document.getElementById('timer').textContent=Math.ceil(time);
 attackCooldown=Math.max(0,attackCooldown-dt);heavyCooldown=Math.max(0,heavyCooldown-dt);dodgeTime=Math.max(0,dodgeTime-dt);
 let dx=joy.x+(keys.a?-1:0)+(keys.d?1:0)+(keys.arrowleft?-1:0)+(keys.arrowright?1:0),dy=joy.y+(keys.w?-1:0)+(keys.s?1:0)+(keys.arrowup?-1:0)+(keys.arrowdown?1:0);
 move(player,dx,dy,player.speed*60*dt);player.guard=guard||keys.i;
 const vx=player.x-enemy.x,vy=player.y-enemy.y,dist=Math.hypot(vx,vy);enemy.face=Math.atan2(vy,vx);enemy.guard=false;
 if(enemy.stun>0)enemy.stun-=dt;else if(dist>enemy.range-3)move(enemy,vx/(dist||1),vy/(dist||1),enemy.speed*60*dt);else if(Math.random()<dt*.9){enemy.attack=.2;if(dodgeTime<=0){let dmg=enemy.damage*(player.guard?.25:1);player.hp=Math.max(0,player.hp-dmg);burst(player.x,player.y-20,'#ff8585',6);if(player.hp<=0)finish(false)}}
 player.attack=Math.max(0,player.attack-dt);enemy.attack=Math.max(0,enemy.attack-dt);
 particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt;p.vx*=.96;p.vy*=.96});
 document.getElementById('heroHp').style.width=(player.hp/player.max*100)+'%';document.getElementById('enemyHp').style.width=(enemy.hp/enemy.max*100)+'%';
}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawFighter(p,isEnemy){
 const scale=.72+(p.y/H)*.5,body=24*scale,head=12*scale;
 ellipse(p.x,p.y+body*.8,body*.9,body*.36,'#0007');
 // facing shadow / weapon
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.face);
 if(p.attack>0){ctx.strokeStyle=isEnemy?'#ffaaaa':'#ffe49a';ctx.lineWidth=7*scale;ctx.beginPath();ctx.arc(0,0,body*1.6,-.8,.8);ctx.stroke()}
 ctx.strokeStyle=isEnemy?'#f4c5c5':'#dce9ff';ctx.lineWidth=5*scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(8*scale,2*scale);ctx.lineTo(31*scale,-7*scale);ctx.stroke();
 ctx.restore();
 // legs
 ctx.strokeStyle='#26324a';ctx.lineWidth=7*scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x-6*scale,p.y+body*.35);ctx.lineTo(p.x-10*scale,p.y+body);ctx.moveTo(p.x+6*scale,p.y+body*.35);ctx.lineTo(p.x+10*scale,p.y+body);ctx.stroke();
 // torso
 ellipse(p.x,p.y,body*.68,body*.85,p.color);ellipse(p.x,p.y-body*.62,head,head,'#f1c9a5');
 ctx.fillStyle=isEnemy?'#672d38':'#243a62';ctx.beginPath();ctx.arc(p.x,p.y-body*.7,head*1.08,Math.PI,Math.PI*2);ctx.fill();
 if(p.guard){ctx.strokeStyle='#9fe6ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,body*1.5,0,Math.PI*2);ctx.stroke()}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // atmospheric sky
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#172c4b');sky.addColorStop(.55,'#344b65');sky.addColorStop(1,'#182338');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // distant floating ruins
 ctx.fillStyle='#91a8c055';for(let i=0;i<6;i++){let x=(i*197+40)%W,y=H*.17+(i%3)*23;ctx.fillRect(x,y,70,8);ctx.fillRect(x+15,y-18,8,20)}
 // arena perspective floor
 ctx.beginPath();ctx.moveTo(W*.18,H*.18);ctx.lineTo(W*.82,H*.18);ctx.lineTo(W*.99,H*.88);ctx.lineTo(W*.01,H*.88);ctx.closePath();ctx.fillStyle='#59647a';ctx.fill();ctx.strokeStyle='#d8c58c';ctx.lineWidth=4;ctx.stroke();
 ctx.save();ctx.beginPath();ctx.moveTo(W*.18,H*.18);ctx.lineTo(W*.82,H*.18);ctx.lineTo(W*.99,H*.88);ctx.lineTo(W*.01,H*.88);ctx.closePath();ctx.clip();
 ctx.fillStyle='#737b86';ctx.fillRect(0,H*.18,W,H*.7);
 for(let i=0;i<12;i++){let y=H*.2+i*i*H*.004;ctx.strokeStyle=i%2?'#d5c59a33':'#263a5033';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let i=-5;i<=5;i++){ctx.strokeStyle='#e9d8a533';ctx.beginPath();ctx.moveTo(W/2+i*W*.06,H*.18);ctx.lineTo(W/2+i*W*.16,H*.9);ctx.stroke()}
 // central sigil
 ctx.strokeStyle='#e4c77b88';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W/2,H*.52,W*.14,H*.09,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(W/2-W*.11,H*.52);ctx.lineTo(W/2+W*.11,H*.52);ctx.moveTo(W/2,H*.43);ctx.lineTo(W/2,H*.61);ctx.stroke();
 ctx.restore();
 // pillars
 for(let i=0;i<4;i++){let x=i%2?W*.84:W*.16,y=i<2?H*.28:H*.78;ctx.fillStyle='#303d54';ctx.fillRect(x-12,y-28,24,50);ctx.fillStyle='#b6a47a';ctx.fillRect(x-17,y-31,34,7)}
 if(started){const order=[player,enemy].sort((a,b)=>a.y-b.y);order.forEach(p=>drawFighter(p,p===enemy));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ellipse(p.x,p.y,3,3,p.color);ctx.globalAlpha=1})}
 else {ctx.fillStyle='#ffffffcc';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText('THE GATE OF LEGENDS',W/2,H*.5)}
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
